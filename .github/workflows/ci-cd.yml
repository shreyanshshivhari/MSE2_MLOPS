# .github/workflows/ci-cd.yml
# ============================
# PURPOSE (MLOps context):
#   CI/CD (Continuous Integration / Continuous Deployment) automates
#   testing and deployment every time code is pushed to GitHub.
#   - CI: Run tests automatically to catch bugs early.
#   - CD: If tests pass, build and push a new Docker image to Docker Hub.
#   This means the latest model-serving image is ALWAYS up-to-date.
#
# REQUIRED GITHUB SECRETS (set in repo → Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  : your Docker Hub username
#   DOCKERHUB_TOKEN     : Docker Hub access token (not your password)
# ========================================================================

name: CI / CD Pipeline

on:
  push:
    branches: [ main ]       # trigger on every push to main
  pull_request:
    branches: [ main ]       # trigger on every PR targeting main
  workflow_dispatch:         # allow manual trigger from GitHub UI

# ════════════════════════════════════════════════════════════════════════
#  JOB 1: test
#  Runs on every push and PR.  Installs dependencies and runs pytest.
# ════════════════════════════════════════════════════════════════════════

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the correct Python version
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Cache pip packages so repeated runs are faster
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install all Python dependencies from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Prepare synthetic training data (no Kaggle CSVs needed in CI)
      - name: Prepare synthetic data
        run: python src/prepare_data.py --n 30

      # 6. Train the model so the API can load it during tests
      - name: Train model
        run: python src/train.py

      # 7. Run the full pytest test suite
      - name: Run pytest
        run: |
          MLFLOW_DISABLE_AGENT_HINT=1 pytest tests/ -v --tb=short


# ════════════════════════════════════════════════════════════════════════
#  JOB 2: build-and-push
#  Runs ONLY when tests pass AND the push is to the main branch.
#  Builds the Docker image and pushes it to Docker Hub.
# ════════════════════════════════════════════════════════════════════════

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                        # only runs if 'test' job succeeded
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Prepare data and train model so models/ exists when Docker builds
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and train model
        run: |
          pip install -r requirements.txt
          python src/prepare_data.py --n 30
          python src/train.py

      # 3. Log in to Docker Hub using repository secrets
      #    Never hardcode credentials — always use GitHub Secrets!
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push the Docker image with two tags:
      #    - 'latest'    : always points to the most recent build
      #    - commit SHA  : pinpoints the exact code version that built this image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-doc-classifier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-doc-classifier:${{ github.sha }}
