# .github/workflows/ci-cd.yml
# ============================
# GitHub Actions CI/CD Pipeline
# Using GitHub Container Registry (GHCR) — Zero external secrets needed!
# ========================================================================

name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write    # Grants permission to push Docker images to ghcr.io

jobs:
  # ════════════════════════════════════════════════════════════════════════
  #  JOB 1: Test the application
  # ════════════════════════════════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare synthetic data
        run: python src/prepare_data.py --n 30

      - name: Train model
        run: python src/train.py

      - name: Run automated tests
        run: pytest tests/ -v --tb=short

  # ════════════════════════════════════════════════════════════════════════
  #  JOB 2: Build and publish Docker image to GitHub Container Registry (GHCR)
  # ════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Publish Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare data and train model for Docker image
        run: |
          pip install -r requirements.txt
          python src/prepare_data.py --n 30
          python src/train.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR using built-in github.actor and secrets.GITHUB_TOKEN (NO SETUP NEEDED!)
      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smart-doc-classifier
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
